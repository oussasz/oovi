# Copies a release's installers and notes from this private repo to the downloads repo
# (oussasz/oovi-downloads). Apps up to 0.8.8 update from there; from 0.8.9 on, the app and the
# website use https://oovi.conuron.com/updates, which reads this private repo when the website has
# GITHUB_RELEASES_TOKEN (and the downloads repo otherwise). Only installer and update files are copied; the source code and the Microsoft
# Store package (.appx) stay private.
#
# Runs by itself after "Build desktop apps" finishes for a published release.
# To (re)publish an existing release by hand: Actions -> "Publish to downloads" -> Run workflow,
# and type the tag (e.g. v0.8.8).
#
# Needs the repository secret DOWNLOADS_TOKEN: a fine-grained GitHub token with access to
# oussasz/oovi-downloads only, permission "Contents: Read and write".
name: Publish to downloads

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      DOWNLOADS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.8.8)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-downloads-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      PUBLIC_REPO: oussasz/oovi-downloads
    steps:
      - name: Check the downloads token is set up
        env:
          DOWNLOADS_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$DOWNLOADS_TOKEN" ]; then
            echo "::error::The DOWNLOADS_TOKEN secret is missing (Settings > Secrets and variables > Actions). The installers were built but not copied to $PUBLIC_REPO."
            exit 1
          fi

      - name: Download the installers from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir work
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir work \
            --pattern "*.dmg" --pattern "*.exe" --pattern "*.exe.blockmap" --pattern "*.AppImage" --pattern "*.deb" --pattern "latest*.yml"
          ls -lh work
          # The real release notes, so the public copy matches what the website shows.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # Every platform must be there, or its users would be left on the old version.
          for want in "*.exe" "*arm64.dmg" "*.AppImage" "*.deb" "latest.yml" "latest-mac.yml" "latest-linux.yml"; do
            compgen -G "work/$want" > /dev/null || { echo "::error::$want is missing from release $TAG (did a build fail?)"; exit 1; }
          done

      - name: Publish to the downloads repo
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$PUBLIC_REPO" > /dev/null 2>&1; then
            echo "Updating the existing release $TAG on $PUBLIC_REPO"
            gh release upload "$TAG" work/* --repo "$PUBLIC_REPO" --clobber
            gh release edit "$TAG" --repo "$PUBLIC_REPO" --notes-file notes.md
          else
            echo "Creating release $TAG on $PUBLIC_REPO"
            gh release create "$TAG" work/* --repo "$PUBLIC_REPO" --title "oovi $TAG" --notes-file notes.md --latest
          fi
          echo "Done: https://github.com/$PUBLIC_REPO/releases/tag/$TAG"
