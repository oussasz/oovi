# The cloud runner's image (runner/Dockerfile), for amd64 and arm64 servers, pushed to GitHub Container Registry as
# ghcr.io/<owner>/oovi-runner. Servers set up with infra/setup.sh pull :latest every 6 hours.
# Runs by hand (Actions tab > Runner image > Run workflow) and on every push to main that changes the runner or the
# engine it runs (the app's lib/ and app/ are the runner's engine too). Only main gets :latest.
name: Runner image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runner/**"
      - "lib/**"
      - "app/**"
      - "instrumentation.ts"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/runner-image.yml"
permissions:
  contents: read
  packages: write
concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oovi-runner" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # First for this machine only, to check that it starts (and refuses to run without its settings).
      - name: Build (test copy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          load: true
          tags: oovi-runner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image
        run: |
          set -e
          # Without settings it stops with a clear message, and never prints a secret.
          out="$(docker run --rm oovi-runner:test 2>&1 || true)"
          echo "$out" | grep -q "OOVI_WEB_URL" || { echo "$out"; exit 1; }
          # The engine and the runner are in place.
          docker run --rm --entrypoint sh oovi-runner:test -c 'test -f /app/server/server.js && test -f /app/runner/index.mjs && node /app/runner/health.cjs; test $? -eq 1'
          # No secrets or local data inside.
          docker run --rm --entrypoint sh oovi-runner:test -c '! find /app -name ".env*" -o -name "session.json" -o -name ".device-key" | grep -q .'
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.name.outputs.image) || format('{0}:{1}', steps.name.outputs.image, github.ref_name) }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
