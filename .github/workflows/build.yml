# Builds the oovi desktop installers on GitHub's machines:
#   macOS   -> oovi-<version>-arm64.dmg (Apple silicon) and oovi-<version>.dmg (Intel)
#   Windows -> oovi-Setup-<version>.exe
#
# Two ways to use it:
#   1. Publish a GitHub Release (Releases -> Draft a new release -> tag like v0.5.0).
#      The installers are built and attached to that release automatically.
#   2. Actions tab -> "Build desktop apps" -> Run workflow: installers appear under
#      the run's "Artifacts" (handy for testing without a release).
name: Build desktop apps

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # needed to attach installers to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Apple/Windows signing certificate yet: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Give the Windows installer a URL-friendly name
        if: runner.os == 'Windows'
        shell: bash
        run: for f in dist/*Setup*.exe; do mv "$f" "${f// /-}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: oovi-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
      - name: Attach installers to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg dist/*.exe --clobber
