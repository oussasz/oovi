# Builds the oovi desktop installers on GitHub's machines:
#   macOS   -> oovi-<version>-arm64.dmg (Apple silicon) and oovi-<version>.dmg (Intel)
#   Windows -> oovi-Setup-<version>.exe
#
# Two ways to use it:
#   1. Publish a GitHub Release (Releases -> Draft a new release -> tag like v0.5.0).
#      The installers are built and attached to that release automatically.
#   2. Actions tab -> "Build desktop apps" -> Run workflow: installers appear under
#      the run's "Artifacts" (handy for testing without a release).
name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: attach the installers to this existing release tag (e.g. v0.4.1)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write # needed to attach installers to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        # Windows also builds the Microsoft Store package (.appx), which goes to the
        # private release only; the Store signs it when it's published.
        run: npx electron-builder ${{ matrix.target }} ${{ runner.os == 'Windows' && 'nsis appx' || '' }} --publish never
        env:
          # No Apple/Windows signing certificate yet: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Give the Windows installer a URL-friendly name
        if: runner.os == 'Windows'
        shell: bash
        run: for f in dist/*Setup*.exe; do n="${f// /-}"; [ "$f" = "$n" ] || mv "$f" "$n"; done
      # A spare copy under the run's "Artifacts", only for test builds (no release). A release gets its
      # installers attached below, so this copy must never block one: GitHub's artifact storage can be full.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release' && inputs.tag == ''
        continue-on-error: true
        with:
          name: oovi-${{ runner.os }}
          retention-days: 3
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.appx
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
      - name: Attach installers to the release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          shopt -s nullglob
          # Each machine uploads only what it built. latest.yml + .blockmap let the
          # Windows app update itself (they hold the installer's checksum).
          files=(dist/*.dmg dist/*.exe dist/*.appx dist/latest*.yml dist/*.exe.blockmap)
          echo "Uploading ${files[*]} to $TAG"
          gh release upload "$TAG" "${files[@]}" --clobber

  # After both machines have attached their installers, copy them to the public downloads
  # repo (website download buttons + the app's self-update). See publish-downloads.yml.
  downloads:
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    uses: ./.github/workflows/publish-downloads.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
    secrets:
      DOWNLOADS_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
