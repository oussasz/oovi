<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>oovi expert intro</title>
<style>
  @font-face { font-family: "Nunito"; src: url("fonts/nunito-latin.woff2") format("woff2"); font-weight: 200 1000; font-style: normal; }
  :root { --bg: #FBF9F5; --ink: #121212; --blue: #A7B8F6; --blue-soft: #C9D3FA; --yellow: #FAD56F; --yellow-soft: #FCE7A4; --pink: #F8A5A0; --pink-soft: #FBD0CC; --lilac: #D9D4F8; --lilac-soft: #ECE9FC; --muted: #55545c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Nunito", system-ui, sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: var(--bg); }
  svg.layer { position: absolute; inset: 0; width: 1080px; height: 1080px; }
  .t { position: absolute; left: 0; width: 1080px; text-align: center; will-change: transform, opacity; opacity: 0; }
  .w { display: inline-block; will-change: transform, opacity; }
  .h1 { font-weight: 900; font-size: 98px; line-height: 1.04; letter-spacing: -0.035em; }
  .sub { font-weight: 700; font-size: 50px; line-height: 1.2; color: var(--muted); letter-spacing: -0.01em; }
  .sub b { color: var(--ink); font-weight: 900; }
  .trait { font-weight: 900; font-size: 128px; letter-spacing: -0.04em; line-height: 1; }
  .quote { font-weight: 800; font-size: 62px; line-height: 1.16; letter-spacing: -0.02em; padding: 0 90px; }
  .cite { font-weight: 800; font-size: 34px; color: var(--muted); }
  .promise { font-weight: 900; font-size: 84px; line-height: 1.06; letter-spacing: -0.035em; padding: 0 70px; }
  .pill { position: absolute; display: flex; align-items: center; justify-content: center; gap: 18px; height: 100px; padding: 0 56px; border-radius: 999px; background: #111; color: #fff; font-weight: 800; font-size: 38px; letter-spacing: -0.01em; opacity: 0; box-shadow: 0 18px 36px rgba(0,0,0,.18); will-change: transform, opacity; white-space: nowrap; }
  .pill.light { background: #fff; color: #111; box-shadow: 0 14px 30px rgba(60,50,120,.16); border: 2px solid #ece8f7; }
  .url { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 800; font-size: 40px; color: var(--muted); opacity: 0; }
  .shotwrap { position: absolute; left: 90px; top: 290px; width: 900px; height: 506px; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: 0 40px 80px rgba(60,50,120,.22), 0 0 0 2px #ece8f7; opacity: 0; will-change: transform, opacity; }
  .shotwrap img { width: 100%; height: 100%; object-fit: cover; display: block; will-change: transform; }
  .card { position: absolute; left: 497px; top: 783px; width: 326px; height: 98px; border-radius: 30px; background: linear-gradient(#F4F1FE, #E6E1FA); box-shadow: 0 16px 30px rgba(110,100,190,.28), inset 0 2px 0 rgba(255,255,255,.9); display: flex; align-items: center; gap: 16px; padding: 0 20px; opacity: 0; will-change: transform, opacity; z-index: 5; }
  .card img { width: 62px; height: 62px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 3px #fff; }
  .card span { font-weight: 800; font-size: 31px; line-height: 1.05; letter-spacing: -0.01em; color: #2b2a35; }
  .logo { position: absolute; width: 150px; height: 150px; opacity: 0; will-change: transform, opacity; }
</style>
</head>
<body>
<div id="stage">
  <!-- back: corner blobs, doodles, slimes, ground -->
  <svg class="layer" id="back" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
    <g id="blobs">
      <circle id="bl-tl" cx="90" cy="-10" r="330" fill="#C8D2FB"/>
      <circle id="bl-tr" cx="1050" cy="-20" r="270" fill="#FCE3A0"/>
      <circle id="bl-tr2" cx="1110" cy="240" r="170" fill="#FBCFCB" opacity=".8"/>
      <circle id="bl-bl" cx="60" cy="1130" r="230" fill="#C8D2FB"/>
      <circle id="bl-br" cx="980" cy="1170" r="250" fill="#F9B7B2"/>
    </g>
    <g id="doodles" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="swirl" d="M6 440 C 70 420, 120 470, 96 520 C 76 565, 40 560, 58 600 C 80 650, 150 590, 200 580 C 240 572, 120 530, 146 545" stroke="#111" stroke-width="5"/>
      <path id="arrow" d="M918 445 C 950 520, 930 560, 850 590" stroke="#111" stroke-width="5"/>
      <path id="arrowhead" d="M884 566 L850 590 L893 604" stroke="#111" stroke-width="5"/>
      <path id="spark" d="M105 288 Q108 316 135 322 Q108 328 105 362 Q102 328 72 322 Q102 316 105 288Z" fill="#F9D56E" stroke="none"/>
      <g id="tick-a" stroke="#111" stroke-width="7"><path d="M833 218 L846 244"/><path d="M866 240 L888 262"/></g>
      <g id="tick-logo" stroke="#111" stroke-width="5"><path d="M492 92 L506 112"/><path d="M512 90 L519 106"/></g>
    </g>
    <g id="slimes">
      <g id="s-blue">
        <circle cx="212" cy="870" r="140" fill="#A7B8F6"/>
        <ellipse cx="170" cy="800" rx="60" ry="30" fill="#fff" opacity=".18"/>
        <g id="eyes-blue" stroke="#111" stroke-width="13" stroke-linecap="round"><path d="M198 780 L199 806"/><path d="M236 782 L237 808"/></g>
        <g stroke="#111" stroke-width="7" stroke-linecap="round" id="tick-blue"><path d="M150 676 L166 706"/><path d="M182 664 L190 692"/></g>
      </g>
      <g id="s-yellow">
        <circle cx="395" cy="835" r="108" fill="#FAD56F"/>
        <g stroke="#111" stroke-width="8" stroke-linecap="round" fill="none" id="eyes-yellow"><path d="M352 790 Q364 778 378 792"/><path d="M406 784 L430 794 L406 806"/></g>
        <path id="curl-y" d="M372 718 C364 690 392 686 392 706 C392 722 372 712 386 700 M404 716 C398 692 424 688 424 706" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g>
      <g id="s-pink">
        <circle cx="920" cy="840" r="112" fill="#F8A5A0"/>
        <g id="eyes-pink"><circle cx="880" cy="790" r="27" fill="#111"/><circle cx="946" cy="780" r="27" fill="#111"/><path d="M886 812 q4 6 10 2" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/></g>
        <path id="curl-p" d="M898 730 C888 700 920 696 920 716 C920 732 898 722 912 710 M930 726 C924 702 950 698 950 716" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
        <g id="tick-pink" stroke="#111" stroke-width="7" stroke-linecap="round"><path d="M1004 722 L1018 740"/><path d="M1020 712 L1034 726"/></g>
      </g>
      <g id="s-purple">
        <circle cx="660" cy="790" r="168" fill="#D9D4F8"/>
        <ellipse cx="610" cy="690" rx="90" ry="40" fill="#fff" opacity=".28"/>
        <g id="eyes-purple">
          <g fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"><path d="M600 705 Q618 686 636 705"/><path d="M716 708 Q736 688 756 708"/></g>
        </g>
        <g fill="none" stroke="#111" stroke-width="9"><circle cx="618" cy="702" r="50"/><circle cx="738" cy="708" r="52"/><path d="M668 702 Q678 696 686 704"/><path d="M568 700 L560 694"/></g>
        <path d="M672 742 q6 8 14 0" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
        <g id="tick-purple" stroke="#FAD56F" stroke-width="12" stroke-linecap="round"><path d="M720 574 L728 604"/><path d="M758 586 L778 612"/><path d="M790 622 L818 636"/></g>
      </g>
    </g>
    <path id="ground" d="M0 884 C 220 846, 420 870, 560 858 S 900 846, 1080 890 L1080 1080 L0 1080Z" fill="#FBF9F5"/>
    <g id="front-blobs">
      <circle id="fb-bl" cx="60" cy="1130" r="230" fill="#C8D2FB"/>
      <circle id="fb-br" cx="980" cy="1170" r="250" fill="#F9B7B2"/>
    </g>
    <g id="hands" fill="#E4DFFB" stroke="#fff" stroke-width="3">
      <ellipse id="hand-l" cx="540" cy="782" rx="40" ry="28"/>
      <ellipse id="hand-r" cx="790" cy="776" rx="40" ry="28"/>
    </g>
  </svg>

  <!-- text, card, screenshot, buttons -->
  <div class="t h1" id="h-l1" style="top:236px"><span class="w">A</span> <span class="w">new</span> <span class="w">mind</span></div>
  <div class="t h1" id="h-l2" style="top:330px"><span class="w">just</span> <span class="w">joined</span> <span class="w">the</span> <span class="w">team.</span></div>
  <div class="t sub" id="subtitle" style="top:452px"><span id="sub1">Meet <b id="sub-name"></b></span><br><span id="sub2">on <b>oovi</b>.</span></div>

  <div class="t trait" id="trait0" style="top:190px"></div>
  <div class="t trait" id="trait1" style="top:340px"></div>
  <div class="t trait" id="trait2" style="top:490px"></div>
  <div class="t quote" id="quote" style="top:230px"></div>
  <div class="t cite" id="cite" style="top:520px"></div>
  <div class="t promise" id="promise" style="top:250px"></div>

  <div class="t promise" id="shot-title" style="top:120px;font-size:64px;padding:0 40px"></div>
  <div class="shotwrap" id="shot"><img id="shot-img" alt=""></div>

  <div class="t promise" id="inv1" style="top:230px;font-size:100px"></div>
  <div class="t promise" id="inv2" style="top:360px;font-size:64px;color:#3b3a45"></div>
  <div class="pill light" id="apply" style="top:560px"></div>
  <div class="url" id="applyurl" style="top:690px"></div>

  <img class="logo" id="logo" src="assets/mark.png" alt="">
  <div class="t promise" id="fin1" style="top:300px;font-size:116px"></div>
  <div class="t promise" id="fin2" style="top:420px;font-size:116px"></div>

  <div class="card" id="card"><img id="photo" alt=""><span id="card-name"></span></div>
  <div class="pill" id="cta" style="left:0;top:940px"></div>
  <div class="url" id="site" style="top:880px"></div>
</div>

<script>
const C = window.CONFIG;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, s, d) => clamp((t - s) / d);
const out3 = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

// ---- fill text from the config ----
$("sub-name").textContent = C.name;
$("photo").src = C.photo; $("card-name").innerHTML = C.nameLines.join("<br>");
C.traits.forEach((w, i) => ($("trait" + i).textContent = w));
$("quote").textContent = "“" + C.quote.replace(/^“|”$/g, "") + "”";
$("cite").textContent = C.name + " · " + C.role;
$("promise").textContent = C.promise;
$("shot-title").textContent = C.shotTitle; $("shot-img").src = C.shot;
$("inv1").textContent = C.expertInvite[0]; $("inv2").textContent = C.expertInvite[1];
$("apply").innerHTML = C.applyButton + " <span>→</span>"; $("applyurl").textContent = C.applyUrl;
$("fin1").textContent = C.finalTitle[0]; $("fin2").textContent = C.finalTitle[1];
$("cta").innerHTML = C.cta + " <span>→</span>"; $("site").textContent = C.site;
const traitColors = ["#F4B93E", "#7C93F0", "#EE7C74"];
C.traits.forEach((_, i) => ($("trait" + i).style.color = traitColors[i % 3]));
// centre the pills (width depends on the text)
for (const id of ["apply", "cta"]) { const e = $(id); e.style.left = (1080 - e.offsetWidth) / 2 + "px"; }
$("logo").style.left = "465px";

// ---- helpers ----
function svgT(el, x, y, sx, sy, rot = 0, px = 0, py = 0) {
  el.setAttribute("transform", `translate(${x} ${y}) translate(${px} ${py}) rotate(${rot}) scale(${sx} ${sy}) translate(${-px} ${-py})`);
}
function htmlT(el, o, x = 0, y = 0, sx = 1, sy = 1, rot = 0) {
  el.style.opacity = o; el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sx}, ${sy})`;
}
// a pop: overshoot scale + stretch, from below
function pop(el, t, s, d = 0.55, rise = 46) {
  const p = P(t, s, d), b = back(p), o = clamp(p * 3);
  const squash = Math.sin(Math.PI * p) * (1 - p) * 0.22;
  htmlT(el, o, 0, (1 - out3(p)) * rise, b * (1 - squash * 0.5), b * (1 + squash));
}
function fade(el, t, a, b, rise = 24) { // in at a (0.5s), out at b (0.4s)
  const i = out3(P(t, a, 0.5)), o = 1 - inOut(P(t, b, 0.4));
  htmlT(el, Math.min(i, o), 0, (1 - i) * rise - (1 - o) * 30);
}
const slime = (id, cx, cy, t, s, delay, bob, ph) => {
  const el = $(id), p = P(t, s, 0.7), b = back(p);
  const idle = Math.sin(t * 2.2 + ph) * bob, breathe = 1 + Math.sin(t * 2.2 + ph + 1.1) * 0.012;
  const out = inOut(P(t, SC.slimesOut, 0.6));
  const y = (1 - out3(p)) * 330 + idle + out * 420;
  const sx = b * (1 - Math.sin(Math.PI * p) * (1 - p) * 0.12) * breathe, sy = b * (1 + Math.sin(Math.PI * p) * (1 - p) * 0.12) / breathe;
  svgT(el, 0, y, sx, sy, 0, cx, cy + 140);
  el.setAttribute("opacity", clamp(p * 4) * (1 - out));
};
const blinkOf = (t, off) => { const k = (t + off) % 3.4; return k > 3.2 ? 1 - Math.sin(Math.PI * (k - 3.2) / 0.2) * 0.92 : 1; };

// ---- the timeline (seconds) ----
const SC = { slimesOut: 13.1, headOut: 7.2 };
const T = { total: 25.6 };
window.DURATION = T.total;

window.seek = function (t) {
  // corner blobs: grow in, then drift
  const bp = out3(P(t, 0, 0.9)), drift = Math.sin(t * 0.7);
  svgT($("bl-tl"), -20 * (1 - bp) + drift * 6, -20 * (1 - bp), 0.6 + 0.4 * bp, 0.6 + 0.4 * bp, 0, 90, -10);
  svgT($("bl-tr"), 20 * (1 - bp), -20 * (1 - bp) + drift * 5, 0.6 + 0.4 * bp, 0.6 + 0.4 * bp, 0, 1050, -20);
  svgT($("bl-tr2"), 60 * (1 - bp), drift * 8, bp, bp, 0, 1110, 240);
  svgT($("bl-bl"), 0, 60 * (1 - bp) - drift * 5, bp, bp, 0, 60, 1130);
  svgT($("bl-br"), 0, 60 * (1 - bp) + drift * 6, bp, bp, 0, 980, 1170);
  svgT($("fb-bl"), 0, 60 * (1 - bp) - drift * 5, bp, bp, 0, 60, 1130);
  svgT($("fb-br"), 0, 60 * (1 - bp) + drift * 6, bp, bp, 0, 980, 1170);

  // logo trio: pops at the top, then comes back at the end
  const lg = $("logo"); let lo, ly, ls;
  if (t < 12) { const p = P(t, 0.35, 0.7), q = inOut(P(t, SC.headOut, 0.5)); lo = clamp(p * 3) * (1 - q); ls = back(p); ly = 84 - q * 70; }
  else { const p = P(t, 21.5, 0.7); lo = clamp(p * 3); ls = back(p); ly = 150 + (1 - out3(p)) * 50 + Math.sin(t * 2.4) * 6; }
  lg.style.top = ly + "px"; lg.style.opacity = lo; lg.style.transform = `scale(${ls}) rotate(${Math.sin(t * 2) * 3}deg)`;
  const tl = $("tick-logo"); tl.setAttribute("opacity", t < 12 ? clamp(P(t, 0.7, 0.2)) * (1 - P(t, SC.headOut, 0.3)) * (0.5 + 0.5 * Math.sin(t * 9)) : 0);

  // ---- scene A: headline, subtitle, doodles (0 – 7.6) ----
  const A = 1 - inOut(P(t, SC.headOut, 0.5)); // leaves
  const lift = (1 - A) * -70;
  document.querySelectorAll("#h-l1 .w").forEach((w, i) => pop(w, t, 0.85 + i * 0.16));
  document.querySelectorAll("#h-l2 .w").forEach((w, i) => pop(w, t, 1.35 + i * 0.16));
  for (const id of ["h-l1", "h-l2"]) { const e = $(id); e.style.opacity = A; e.style.transform = `translateY(${lift}px)`; }
  const s1 = out3(P(t, 2.35, 0.5)), s2 = out3(P(t, 2.6, 0.5));
  const sub = $("subtitle"); sub.style.opacity = A; sub.style.transform = `translateY(${lift}px)`;
  $("sub1").style.display = "inline-block"; $("sub2").style.display = "inline-block";
  $("sub1").style.opacity = s1; $("sub1").style.transform = `translateY(${(1 - s1) * 30}px)`;
  $("sub2").style.opacity = s2; $("sub2").style.transform = `translateY(${(1 - s2) * 30}px)`;
  // doodles draw themselves
  const draw = (id, p) => { const e = $(id), L = e.getTotalLength(); e.style.strokeDasharray = L; e.style.strokeDashoffset = L * (1 - p); e.setAttribute("opacity", A); };
  draw("swirl", out3(P(t, 1.0, 1.3))); draw("arrow", out3(P(t, 3.0, 0.7))); draw("arrowhead", out3(P(t, 3.55, 0.25)));
  const sp = P(t, 1.6, 0.6); svgT($("spark"), 0, 0, back(sp) * (0.9 + 0.1 * Math.sin(t * 4)), back(sp) * (0.9 + 0.1 * Math.sin(t * 4)), Math.sin(t * 1.5) * 20, 105, 322);
  $("spark").setAttribute("opacity", clamp(sp * 3) * A);
  $("tick-a").setAttribute("opacity", clamp(P(t, 1.2, 0.2)) * A * (0.55 + 0.45 * Math.sin(t * 8)));

  // slimes rise (stay through scene B, sink before the screenshot)
  slime("s-blue", 212, 870, t, 2.55, 0, 5, 0.0);
  slime("s-yellow", 395, 835, t, 2.75, 0, 6, 1.3);
  slime("s-pink", 920, 840, t, 2.95, 0, 5, 2.4);
  slime("s-purple", 660, 790, t, 3.15, 0, 7, 0.6);
  // blinking: eyes squash vertically
  const eyeBlink = (id, cx, cy, off) => svgT($(id), 0, 0, 1, blinkOf(t, off), 0, cx, cy);
  eyeBlink("eyes-blue", 218, 794, 0.5); eyeBlink("eyes-yellow", 392, 792, 1.7); eyeBlink("eyes-pink", 913, 785, 0.9); eyeBlink("eyes-purple", 678, 702, 2.4);
  // curls/ticks wiggle
  const wig = (id, a, cx, cy, ph) => svgT($(id), 0, 0, 1, 1, Math.sin(t * 3 + ph) * a, cx, cy);
  wig("curl-y", 5, 400, 720, 0); wig("curl-p", 5, 925, 725, 2);
  const tp = clamp(P(t, 4.5, 0.2)) * (1 - inOut(P(t, SC.slimesOut, 0.3)));
  $("tick-purple").setAttribute("opacity", tp * (0.5 + 0.5 * Math.sin(t * 7)));
  $("tick-blue").setAttribute("opacity", clamp(P(t, 3.3, 0.2)) * (1 - inOut(P(t, SC.slimesOut, 0.3))) * (0.6 + 0.4 * Math.sin(t * 6 + 1)));
  $("tick-pink").setAttribute("opacity", clamp(P(t, 3.6, 0.2)) * (1 - inOut(P(t, SC.slimesOut, 0.3))) * (0.6 + 0.4 * Math.sin(t * 6 + 2)));
  // ground + hands follow the slimes down
  const down = inOut(P(t, SC.slimesOut, 0.6)) * 420;
  svgT($("ground"), 0, down * 0.0, 1, 1); $("ground").setAttribute("opacity", 1 - inOut(P(t, SC.slimesOut + 0.2, 0.4)));
  const hp = P(t, 4.0, 0.5), hb = back(hp);
  $("hands").setAttribute("opacity", clamp(hp * 3) * (1 - inOut(P(t, SC.slimesOut, 0.4))));
  svgT($("hands"), 0, (1 - out3(hp)) * 40 + Math.sin(t * 2.2 + 0.6) * 7 + down, hb, hb, 0, 665, 780);

  // name card slides up out of the purple slime's hands
  const card = $("card"), cp = P(t, 4.0, 0.6), cb = back(cp);
  const cardY = (1 - out3(cp)) * 110 + Math.sin(t * 2.2 + 0.6) * 7 + down;
  htmlT(card, clamp(cp * 3) * (1 - inOut(P(t, SC.slimesOut, 0.4))), 0, cardY, cb, cb);
  const ph = $("photo"), pp = P(t, 4.45, 0.5); ph.style.transform = `scale(${back(pp)})`; ph.style.opacity = clamp(pp * 3);

  // download pill (like the poster)
  const cta = $("cta");
  cta.style.top = t < 12 ? "938px" : "770px";
  if (t < 12) { pop(cta, t, 4.9, 0.6, 40); const a = 1 - inOut(P(t, SC.headOut, 0.4)); cta.style.opacity = Math.min(cta.style.opacity, a); }
  else if (t >= 21.9) { pop(cta, t, 22.2, 0.6, 50); const pulse = 1 + Math.sin((t - 22.8) * 4) * 0.025 * clamp(t - 22.8); cta.style.transform += ` scale(${pulse})`; }
  else htmlT(cta, 0, 0, 0);

  // ---- scene B: traits, quote, promise (7.7 – 13.2) ----
  const B0 = 7.7;
  ["trait0", "trait1", "trait2"].forEach((id, i) => {
    const e = $(id), s = B0 + 0.2 + i * 0.5, out = 1 - inOut(P(t, 10.0, 0.4)); pop(e, t, s, 0.6, 60); e.style.opacity = Math.min(e.style.opacity, out);
  });
  fade($("quote"), t, 10.45, 12.1); fade($("cite"), t, 11.0, 12.1);
  fade($("promise"), t, 12.2, 13.3);

  // ---- scene C: the Marketplace screenshot (13.4 – 17.7) ----
  const sh = $("shot"), sp2 = P(t, 13.5, 0.8), so = 1 - inOut(P(t, 17.2, 0.5));
  htmlT(sh, clamp(sp2 * 2) * so, 0, (1 - out3(sp2)) * 160 - (1 - so) * 60, 0.94 + 0.06 * out3(sp2), 0.94 + 0.06 * out3(sp2));
  $("shot-img").style.transform = `scale(${1 + (t - 13.5) * 0.012})`;
  fade($("shot-title"), t, 13.5, 17.2);

  // ---- scene D: invite experts (17.8 – 21.5) ----
  const D = 1 - inOut(P(t, 21.2, 0.4));
  const inv1 = $("inv1"), inv2 = $("inv2"); pop(inv1, t, 17.9, 0.6, 50); pop(inv2, t, 18.4, 0.6, 40);
