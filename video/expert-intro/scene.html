        <path id="curl-p" d="M898 730 C888 700 920 696 920 716 C920 732 898 722 912 710 M930 726 C924 702 950 698 950 716" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>

        <path d="M672 742 q6 8 14 0" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
        <g id="tick-purple" stroke="#FAD56F" stroke-width="12" stroke-linecap="round"><path d="M720 574 L728 604"/><path d="M758 586 L778 612"/><path d="M790 622 L818 636"/></g>

  <!-- text, card, screenshot, buttons -->
  <div class="t h1" id="h-l1" style="top:236px"><span class="w">A</span> <span class="w">new</span> <span class="w">mind</span></div>

<script>
const C = window.CONFIG, TL = window.TIMELINE;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, s, d) => clamp((t - s) / d);
const out3 = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const { A, B, C: SC, D, E } = TL;
window.DURATION = TL.total;

// ---- words from the config ----
$("sub-name").textContent = C.name;
$("photo").src = C.photo; $("card-name").innerHTML = C.nameLines.join("<br>");
$("beat1").textContent = C.quoteBeats[0]; $("beat2").textContent = C.quoteBeats[1];
$("coffee1").textContent = C.coffee[0]; $("coffee2").textContent = C.coffee[1];
$("im1").src = C.screens[0]; $("im2").src = C.screens[1]; $("im3").src = C.screens[2];
$("shot-title").textContent = C.shotTitle;
$("inv1").textContent = C.expertInvite[0]; $("inv2").textContent = C.expertInvite[1];
$("apply").innerHTML = C.applyButton + " <span>→</span>"; $("applyurl").textContent = C.applyUrl;
$("fin1").textContent = C.finalTitle[0]; $("fin2").textContent = C.finalTitle[1];
$("cta").innerHTML = C.cta + " <span>→</span>"; $("site").textContent = C.site;
for (const id of ["apply", "cta"]) { const e = $(id); e.style.left = (1080 - e.offsetWidth) / 2 + "px"; }
$("logo").style.left = "465px";

// ---- helpers ----
function svgT(el, x, y, sx, sy, rot = 0, px = 0, py = 0) {
  el.setAttribute("transform", `translate(${x} ${y}) translate(${px} ${py}) rotate(${rot}) scale(${sx} ${sy}) translate(${-px} ${-py})`);
}
function htmlT(el, o, x = 0, y = 0, sx = 1, sy = 1, rot = 0) {
  el.style.opacity = o; el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sx}, ${sy})`;
}
function pop(el, t, s, d = 0.45, rise = 46) {
  const p = P(t, s, d), b = back(p), o = clamp(p * 4);
  const squash = Math.sin(Math.PI * p) * (1 - p) * 0.22;
  htmlT(el, o, 0, (1 - out3(p)) * rise, b * (1 - squash * 0.5), b * (1 + squash));
}
function show(el, t, a, b, rise = 24, d = 0.4) { // fades in at a, out at b
  const i = out3(P(t, a, d)), o = 1 - inOut(P(t, b, 0.3));
  htmlT(el, Math.min(i, o), 0, (1 - i) * rise - (1 - o) * 26);
}
const slimeFns = {};
const slime = (id, cx, cy, t, s, bob, ph) => {
  const el = $(id), p = P(t, s, 0.6), b = back(p);
  const idle = Math.sin(t * 2.6 + ph) * bob, breathe = 1 + Math.sin(t * 2.6 + ph + 1.1) * 0.012;
  const out = inOut(P(t, B.slimesOut, 0.5));
  const y = (1 - out3(p)) * 330 + idle + out * 420;
  const k = Math.sin(Math.PI * p) * (1 - p) * 0.12;
  svgT(el, 0, y, b * (1 - k) * breathe, b * (1 + k) / breathe, 0, cx, cy + 140);
  el.setAttribute("opacity", clamp(p * 4) * (1 - out));
};
const blinkOf = (t, off) => { const k = (t + off) % 3.0; return k > 2.85 ? 1 - Math.sin(Math.PI * (k - 2.85) / 0.15) * 0.92 : 1; };

// cursor path in the app's own pixels (1920x1080)
const bez = (p0, p1, p2, p3, u) => { const v = 1 - u; return [0, 1].map((i) => v * v * v * p0[i] + 3 * v * v * u * p1[i] + 3 * v * u * u * p2[i] + u * u * u * p3[i]); };
const TAB = [834, 160], CARD = [1440, 600], START = [1560, 880];
function cursorAt(t) {
  if (t < SC.tabArrive) return bez(START, [1400, 700], [1000, 90], TAB, inOut(P(t, SC.cursorStart, SC.tabArrive - SC.cursorStart)));
  if (t < SC.cardMove) return [TAB[0] + Math.sin(t * 6) * 1.5, TAB[1] + Math.cos(t * 5) * 1.5];
  return bez(TAB, [900, 330], [1300, 700], CARD, inOut(P(t, SC.cardMove, SC.cardClick - 0.45 - SC.cardMove)));
}
const CAM_S = 0.5;

window.seek = function (t) {
  // corner blobs
  const bp = out3(P(t, 0, 0.6)), drift = Math.sin(t * 0.8);
  svgT($("bl-tl"), -20 * (1 - bp) + drift * 6, -20 * (1 - bp), 0.6 + 0.4 * bp, 0.6 + 0.4 * bp, 0, 90, -10);
  svgT($("bl-tr"), 20 * (1 - bp), -20 * (1 - bp) + drift * 5, 0.6 + 0.4 * bp, 0.6 + 0.4 * bp, 0, 1050, -20);
  svgT($("bl-tr2"), 60 * (1 - bp), drift * 8, bp, bp, 0, 1110, 240);
  svgT($("bl-bl"), 0, 60 * (1 - bp) - drift * 5, bp, bp, 0, 60, 1130);
  svgT($("bl-br"), 0, 60 * (1 - bp) + drift * 6, bp, bp, 0, 980, 1170);
  svgT($("fb-bl"), 0, 60 * (1 - bp) - drift * 5, bp, bp, 0, 60, 1130);
  svgT($("fb-br"), 0, 60 * (1 - bp) + drift * 6, bp, bp, 0, 980, 1170);

  // logo trio
  const lg = $("logo"); let lo, ly, ls;
  if (t < 12) { const p = P(t, A.logo, 0.5), q = inOut(P(t, A.out, 0.4)); lo = clamp(p * 4) * (1 - q); ls = back(p); ly = 84 - q * 70; }
  else { const p = P(t, E.in, 0.6); lo = clamp(p * 3); ls = back(p); ly = 150 + (1 - out3(p)) * 50 + Math.sin(t * 2.4) * 6; }
  lg.style.top = ly + "px"; lg.style.opacity = lo; lg.style.transform = `scale(${ls}) rotate(${Math.sin(t * 2) * 3}deg)`;
  $("tick-logo").setAttribute("opacity", t < 12 ? clamp(P(t, A.logo + 0.3, 0.15)) * (1 - P(t, A.out, 0.3)) * (0.5 + 0.5 * Math.sin(t * 9)) : 0);

  // ---- A: the poster, built fast ----
  const Aout = 1 - inOut(P(t, A.out, 0.4)), lift = (1 - Aout) * -70;
  document.querySelectorAll("#h-l1 .w").forEach((w, i) => pop(w, t, A.h1[i], 0.4));
  document.querySelectorAll("#h-l2 .w").forEach((w, i) => pop(w, t, A.h2[i], 0.4));
  for (const id of ["h-l1", "h-l2", "subtitle"]) { const e = $(id); e.style.opacity = Aout; e.style.transform = `translateY(${lift}px)`; }
  const s1 = out3(P(t, A.sub1, 0.35)), s2 = out3(P(t, A.sub2, 0.35));
  for (const [id, v] of [["sub1", s1], ["sub2", s2]]) { const e = $(id); e.style.display = "inline-block"; e.style.opacity = v; e.style.transform = `translateY(${(1 - v) * 30}px)`; }
  const draw = (id, p) => { const e = $(id), L = e.getTotalLength(); e.style.strokeDasharray = L; e.style.strokeDashoffset = L * (1 - p); e.setAttribute("opacity", Aout); };
  draw("swirl", out3(P(t, A.swirl, 0.8))); draw("arrow", out3(P(t, A.arrow, 0.5))); draw("arrowhead", out3(P(t, A.arrow + 0.4, 0.2)));
  const sp = P(t, A.spark, 0.4); svgT($("spark"), 0, 0, back(sp) * (0.9 + 0.1 * Math.sin(t * 4)), back(sp) * (0.9 + 0.1 * Math.sin(t * 4)), Math.sin(t * 1.5) * 20, 105, 322);
  $("spark").setAttribute("opacity", clamp(sp * 3) * Aout);
  $("tick-a").setAttribute("opacity", clamp(P(t, 0.9, 0.15)) * Aout * (0.55 + 0.45 * Math.sin(t * 8)));

  // slimes
  slime("s-blue", 212, 870, t, A.slimes[0], 5, 0.0); slime("s-yellow", 395, 835, t, A.slimes[1], 6, 1.3);
  slime("s-pink", 920, 840, t, A.slimes[2], 5, 2.4); slime("s-purple", 660, 790, t, A.slimes[3], 7, 0.6);
  const eyeBlink = (id, cx, cy, off) => svgT($(id), 0, 0, 1, blinkOf(t, off), 0, cx, cy);
  eyeBlink("eyes-blue", 218, 794, 0.5); eyeBlink("eyes-yellow", 392, 792, 1.7); eyeBlink("eyes-pink", 913, 785, 0.9); eyeBlink("eyes-purple", 678, 702, 2.4);
  const wig = (id, a, cx, cy, ph) => svgT($(id), 0, 0, 1, 1, Math.sin(t * 3 + ph) * a, cx, cy);
  wig("curl-y", 5, 400, 720, 0); wig("curl-p", 5, 925, 725, 2);
  const gone = 1 - inOut(P(t, B.slimesOut, 0.3));
  $("tick-purple").setAttribute("opacity", clamp(P(t, A.ticks, 0.15)) * gone * (0.5 + 0.5 * Math.sin(t * 7)));
  $("tick-blue").setAttribute("opacity", clamp(P(t, A.slimes[0] + 0.5, 0.15)) * gone * (0.6 + 0.4 * Math.sin(t * 6 + 1)));
  $("tick-pink").setAttribute("opacity", clamp(P(t, A.slimes[2] + 0.5, 0.15)) * gone * (0.6 + 0.4 * Math.sin(t * 6 + 2)));
  const down = inOut(P(t, B.slimesOut, 0.5)) * 420;
  $("ground").setAttribute("opacity", 1 - inOut(P(t, B.slimesOut + 0.2, 0.3)));
  const hp = P(t, A.card, 0.5), hb = back(hp);
  $("hands").setAttribute("opacity", clamp(hp * 3) * gone);
  svgT($("hands"), 0, (1 - out3(hp)) * 40 + Math.sin(t * 2.6 + 0.6) * 7 + down, hb, hb, 0, 665, 780);
  const card = $("card"), cp = P(t, A.card, 0.5), cb = back(cp);
  htmlT(card, clamp(cp * 3) * gone, 0, (1 - out3(cp)) * 110 + Math.sin(t * 2.6 + 0.6) * 7 + down, cb, cb);
  const ph = $("photo"), pp = P(t, A.photo, 0.4); ph.style.transform = `scale(${back(pp)})`; ph.style.opacity = clamp(pp * 3);

  // download pill (poster) and, at the end, the big one
  const cta = $("cta");
  cta.style.top = t < 12 ? "938px" : "770px";
  if (t < 12) { pop(cta, t, A.pill, 0.45, 40); cta.style.opacity = Math.min(cta.style.opacity, Aout); }
  else if (t >= E.cta - 0.1) { pop(cta, t, E.cta, 0.5, 50); const pulse = 1 + Math.sin((t - E.cta - 0.6) * 4.5) * 0.025 * clamp(t - E.cta - 0.6); cta.style.transform += ` scale(${pulse})`; }
  else htmlT(cta, 0, 0, 0);

  // ---- B: his line, then the coffee ----
  const bOut = 1 - inOut(P(t, B.out, 0.3));
  for (const [id, s] of [["beat1", B.beat1], ["beat2", B.beat2]]) { const e = $(id); pop(e, t, s, 0.5, 60); e.style.opacity = Math.min(e.style.opacity, bOut); }
  const cOut = 1 - inOut(P(t, B.slimesOut, 0.3));
  pop($("coffee1"), t, B.coffee, 0.5, 60); $("coffee1").style.opacity = Math.min($("coffee1").style.opacity, cOut);
  pop($("coffee2"), t, B.coffee + 0.35, 0.5, 60); $("coffee2").style.opacity = Math.min($("coffee2").style.opacity, cOut);
  const cu = P(t, B.cup, 0.55), cb2 = back(cu);
  $("cup").setAttribute("opacity", clamp(cu * 4) * cOut);
  svgT($("cup"), 120, -35 + (1 - out3(cu)) * -150 + Math.sin(t * 2.6 + 0.6) * 5 + down * 0, cb2, cb2, 0, 540, 650);
  document.querySelectorAll("#steam path").forEach((p, i) => { const L = p.getTotalLength(); p.style.strokeDasharray = `${L * 0.55} ${L}`; p.style.strokeDashoffset = -((t * 40 + i * 30) % (L * 1.55)) + L * 0.2; });

  // ---- C: the real app, with a mouse ----
  const sh = $("shot"), sIn = P(t, SC.in, 0.7), sOut = 1 - inOut(P(t, SC.out, 0.4));
  htmlT(sh, clamp(sIn * 2) * sOut, 0, (1 - out3(sIn)) * 150 - (1 - sOut) * 50, 0.94 + 0.06 * out3(sIn), 0.94 + 0.06 * out3(sIn));
  show($("shot-title"), t, SC.in, SC.titleOut, 24);
  const sw1 = P(t, SC.tabClick + 0.05, 0.15), sw2 = P(t, SC.cardClick + 0.05, 0.2);
  $("im2").style.opacity = sw1; $("im3").style.opacity = sw2;
  // camera: calm slow push in, then a zoom on the details
  const z = 1 + 0.06 * P(t, SC.in, 3) + 0.88 * inOut(P(t, SC.zoom, 0.9));
  const fz = inOut(P(t, SC.zoom, 0.9)), F = [960, 540 + 5 * fz];
  const camX = 480 - F[0] * CAM_S * z, camY = 270 - F[1] * CAM_S * z;
  $("cam").style.transform = `translate(${camX}px, ${camY}px) scale(${CAM_S * z})`;
  const map = (p) => [camX + p[0] * CAM_S * z, camY + p[1] * CAM_S * z];
  const cur = $("cursor"), cp2 = map(cursorAt(t));
  const click = (c) => { const k = P(t, c, 0.25); return k > 0 && k < 1 ? 1 - Math.sin(Math.PI * k) * 0.18 : 1; };
  const cs = Math.min(click(SC.tabClick), click(SC.cardClick));
  cur.style.opacity = clamp(P(t, SC.cursorStart - 0.05, 0.2)) * (1 - P(t, SC.cardClick + 0.5, 0.3));
  cur.style.transform = `translate(${cp2[0] - 4}px, ${cp2[1] - 3}px) scale(${cs * 1.15})`;
  const rp = (c) => P(t, c, 0.5);
  const rip = $("ripple"), r1 = rp(SC.tabClick), r2 = rp(SC.cardClick), r = r1 > 0 && r1 < 1 ? r1 : r2 > 0 && r2 < 1 ? r2 : 0;
  const rpos = map(r1 > 0 && r1 < 1 ? TAB : CARD);
  rip.style.left = rpos[0] + "px"; rip.style.top = rpos[1] + "px"; rip.style.opacity = r ? 1 - r : 0; rip.style.transform = `scale(${0.4 + r * 2})`;
  const ringIn = out3(P(t, SC.ring, 0.35)) * (1 - P(t, SC.cardClick + 0.1, 0.15));
  $("ring").style.opacity = ringIn; $("ring").style.transform = `scale(${1 + Math.sin(t * 8) * 0.012})`;

  // ---- D: invite experts ----
  const Dout = 1 - inOut(P(t, D.out, 0.35));
  const inv1 = $("inv1"), inv2 = $("inv2"), ap = $("apply");
  pop(inv1, t, D.in, 0.5, 50); pop(inv2, t, D.inv2, 0.5, 40); pop(ap, t, D.apply, 0.5, 40);
  for (const e of [inv1, inv2, ap]) e.style.opacity = Math.min(e.style.opacity, Dout);
  $("applyurl").style.opacity = out3(P(t, D.url, 0.4)) * Dout;

  // ---- E: the call ----
  pop($("fin1"), t, E.fin1, 0.5, 50); pop($("fin2"), t, E.fin2, 0.5, 50);
  $("fin1").style.top = "330px"; $("fin2").style.top = "450px";
  $("site").style.opacity = out3(P(t, E.site, 0.4)); $("site").style.top = "900px";
};
