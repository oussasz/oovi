<style>

  :root { --bg: #F6F5F1; --ink: #0E1014; --muted: #5A5E6B; --line: rgba(14,16,20,.10); --accent: #F5B82E; --blue: #4B63E8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); font-feature-settings: "ss01", "cv11"; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: var(--bg); }
  #bg, #world { position: absolute; inset: 0; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); }
  #grid { position: absolute; inset: -40px 0 0 0; background-image: radial-gradient(rgba(14,16,20,.22) 1.3px, transparent 1.5px); background-size: 38px 38px; -webkit-mask-image: radial-gradient(ellipse at 50% 42%, #000 15%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 42%, #000 15%, transparent 72%); opacity: .5; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(30,28,40,.07) 100%); }
  svg.layer { position: absolute; inset: 0; width: 1080px; height: 1080px; overflow: visible; }
  .t { position: absolute; left: 0; width: 1080px; text-align: center; opacity: 0; will-change: transform, opacity; }
  .wm { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .07em .14em; margin: 0 -.02em; }
  .wi { display: inline-block; will-change: transform, filter, opacity; }
  .h1 { font-weight: 800; font-size: 94px; line-height: 1.0; letter-spacing: -0.045em; }
  .sub { font-weight: 500; font-size: 40px; line-height: 1.25; color: var(--muted); letter-spacing: -0.02em; }
  .sub b { color: var(--ink); font-weight: 700; }
  .h2 { font-weight: 800; font-size: 96px; line-height: 1.0; letter-spacing: -0.045em; }
  .lead { font-weight: 500; font-size: 42px; line-height: 1.2; letter-spacing: -0.02em; color: var(--muted); }
  .cap { font-weight: 700; font-size: 54px; line-height: 1.08; letter-spacing: -0.035em; white-space: nowrap; }
  .chip { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; opacity: 0; }
  .chip span { display: inline-flex; align-items: center; gap: 12px; padding: 11px 20px 11px 16px; border-radius: 999px; background: rgba(255,255,255,.75); border: 1px solid var(--line); backdrop-filter: blur(10px); font-weight: 650; font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: #2b2e38; box-shadow: 0 6px 20px rgba(30,34,60,.06); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px rgba(75,99,232,.18); }
  .pill { position: absolute; display: flex; align-items: center; justify-content: center; gap: 16px; height: 88px; padding: 0 22px 0 44px; border-radius: 999px; background: linear-gradient(#1b1d24, #0c0d11); color: #fff; font-weight: 650; font-size: 31px; letter-spacing: -0.015em; opacity: 0; box-shadow: 0 22px 44px rgba(14,16,20,.22), inset 0 1px 0 rgba(255,255,255,.14); white-space: nowrap; }
  .pill em { display: inline-flex; width: 48px; height: 48px; border-radius: 50%; background: #fff; color: #0E1014; align-items: center; justify-content: center; font-style: normal; font-size: 26px; }
  .pill.light { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: 0 16px 36px rgba(30,34,60,.12); }
  .pill.light em { background: #0E1014; color: #fff; }
  .url { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; color: var(--muted); opacity: 0; }
  .card { position: absolute; left: 470px; top: 770px; width: 392px; height: 112px; border-radius: 28px; background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.9); backdrop-filter: blur(16px); box-shadow: 0 24px 56px rgba(30,34,60,.16), 0 2px 0 rgba(255,255,255,.7) inset; display: flex; align-items: center; gap: 18px; padding: 0 24px 0 20px; opacity: 0; will-change: transform, opacity; z-index: 5; }
  .card img { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 3px #fff, 0 0 0 5px rgba(245,184,46,.9); background: #eee; }

  #win { position: absolute; left: 60px; top: 262px; width: 960px; height: 600px; border-radius: 22px; background: #fff; box-shadow: 0 50px 100px rgba(30,34,60,.22), 0 0 0 1px rgba(14,16,20,.10); opacity: 0; overflow: hidden; will-change: transform, opacity; }
  #bar { height: 30px; background: linear-gradient(#F3F1EC, #E9E6E0); border-bottom: 1px solid rgba(14,16,20,.08); display: flex; align-items: center; gap: 8px; padding-left: 16px; }

  #ripple { position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; border: 4px solid var(--blue); opacity: 0; z-index: 3; }

<script>
const C = window.CONFIG, TL = window.TIMELINE, MOUTH = window.MOUTH;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, s, d) => clamp((t - s) / d);
const expo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));          // fast start, long calm landing
const cubic = (x) => 1 - Math.pow(1 - x, 3);
const smooth = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const mix = (a, b, k) => a + (b - a) * k;
const { A, B, C: SC, D, E } = TL;
window.DURATION = TL.total;
const amp = (t) => { if (!MOUTH) return 0; const i = (t - MOUTH.t0) * MOUTH.fps; if (i < 0 || i >= MOUTH.values.length - 1) return 0; const k = Math.floor(i), f = i - k; return MOUTH.values[k] * (1 - f) + MOUTH.values[k + 1] * f; };

// ---- words from the config ----
$("sub-name").textContent = C.name;
if (C.look) { for (const [id, attr, v] of [["hero-dome", "fill", C.look.heroFill], ["glasses", "stroke", C.look.glasses]]) if (v) $(id).setAttribute(attr, v); }
$("photo").src = C.photo; $("card-name").innerHTML = C.nameLines.join("<br>"); $("card-role").textContent = C.role;
$("cap1").textContent = C.captions[0]; $("cap2").textContent = C.captions[1];
$("im1").src = C.screens[0]; $("im2").src = C.screens[1]; $("im3").src = C.screens[2];
$("shot-title").textContent = C.shotTitle;
$("inv1").textContent = C.expertInvite[0]; $("inv2").textContent = C.expertInvite[1];
$("apply").innerHTML = C.applyButton + " <em>→</em>"; $("applyurl").textContent = C.applyUrl;
$("fin1").textContent = C.finalTitle[0]; $("fin2").textContent = C.finalTitle[1];
$("cta").innerHTML = C.cta + " <em>→</em>"; $("site").textContent = C.site;
for (const id of ["apply", "cta"]) { const e = $(id); e.style.left = (1080 - e.offsetWidth) / 2 + "px"; }

// ---- helpers ----
function svgT(el, x, y, sx, sy, rot = 0, px = 0, py = 0) { el.setAttribute("transform", `translate(${x} ${y}) translate(${px} ${py}) rotate(${rot}) scale(${sx} ${sy}) translate(${-px} ${-py})`); }
function htmlT(el, o, x = 0, y = 0, sx = 1, sy = 1, rot = 0) { el.style.opacity = o; el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sx}, ${sy})`; }
// an element that rises in (calm, no bounce) and leaves upward
function reveal(el, t, inAt, outAt, rise = 34, dIn = 0.7, dOut = 0.4) {
  const i = expo(P(t, inAt, dIn)), o = 1 - smooth(P(t, outAt, dOut));
  htmlT(el, Math.min(i, o), 0, (1 - i) * rise - (1 - o) * 28);
}
// words that slide up out of a mask
function words(sel, t, times, outAt) {
  document.querySelectorAll(sel + " .wi").forEach((w, i) => {
    const p = expo(P(t, times[i], 0.75)), o = 1 - smooth(P(t, outAt, 0.4));
    w.style.transform = `translateY(${(1 - p) * 112}%)`; w.style.filter = `blur(${(1 - p) * 7}px)`; w.style.opacity = Math.min(1, p * 3) * o;
  });
}
const blinkOf = (t, off) => { const k = (t + off) % 3.4; return k > 3.25 ? 1 - Math.sin(Math.PI * (k - 3.25) / 0.15) * 0.9 : 1; };
const rot2 = (x, y, deg) => { const a = deg * Math.PI / 180; return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)]; };

// the other three slimes lower out of the way when he asks for quiet
const slime = (id, cx, cy, t, s, bob, ph) => {
  const el = $(id), p = expo(P(t, s, 0.9));
  const idle = Math.sin(t * 1.7 + ph) * bob;
  const out = smooth(P(t, B.in, 0.6));

// ---- Abdelaziz: the close-up, the machine, the cup ----

// cursor path in the app's own pixels (1920x1080)
const bez = (p0, p1, p2, p3, u) => { const v = 1 - u; return [0, 1].map((i) => v * v * v * p0[i] + 3 * v * v * u * p1[i] + 3 * v * u * u * p2[i] + u * u * u * p3[i]); };
const TAB = [834, 160], CARD = [1440, 600], START = [1560, 880];
function cursorAt(t) {
  if (t < SC.tabArrive) return bez(START, [1400, 700], [1000, 90], TAB, smooth(P(t, SC.cursorStart, SC.tabArrive - SC.cursorStart)));
  if (t < SC.cardMove) return [TAB[0] + Math.sin(t * 5) * 1.2, TAB[1] + Math.cos(t * 4) * 1.2];
  return bez(TAB, [900, 330], [1300, 700], CARD, smooth(P(t, SC.cardMove, SC.cardClick - 0.3 - SC.cardMove)));
}
const CAM_S = 0.5;

  const z2 = 1 + 0.05 * P(t, SC.in, 3) + 0.88 * smooth(P(t, SC.zoom, 1.0));
