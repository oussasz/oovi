<script>
const C = window.CONFIG, TL = window.TIMELINE, MOUTH = window.MOUTH;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, s, d) => clamp((t - s) / d);
const out3 = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
const { A, B, C: SC, D, E } = TL;
window.DURATION = TL.total;
const amp = (t) => { if (!MOUTH) return 0; const i = (t - MOUTH.t0) * MOUTH.fps; if (i < 0 || i >= MOUTH.values.length - 1) return 0; const k = Math.floor(i), f = i - k; return MOUTH.values[k] * (1 - f) + MOUTH.values[k + 1] * f; };

// ---- words from the config ----
$("sub-name").textContent = C.name;
if (C.look) { for (const [id, attr, v] of [["hero-dome", "fill", C.look.hero], ["other-dome", "fill", C.look.other], ["glasses", "stroke", C.look.glasses]]) if (v) $(id).setAttribute(attr, v); }
$("photo").src = C.photo; $("card-name").innerHTML = C.nameLines.join("<br>");
$("cap1").textContent = C.captions[0]; $("cap2").textContent = C.captions[1];
$("im1").src = C.screens[0]; $("im2").src = C.screens[1]; $("im3").src = C.screens[2];
$("shot-title").textContent = C.shotTitle;
$("inv1").textContent = C.expertInvite[0]; $("inv2").textContent = C.expertInvite[1];
$("apply").innerHTML = C.applyButton + " <span>→</span>"; $("applyurl").textContent = C.applyUrl;
$("fin1").textContent = C.finalTitle[0]; $("fin2").textContent = C.finalTitle[1];
$("cta").innerHTML = C.cta + " <span>→</span>"; $("site").textContent = C.site;
for (const id of ["apply", "cta"]) { const e = $(id); e.style.left = (1080 - e.offsetWidth) / 2 + "px"; }
$("logo").style.left = "465px";

// ---- helpers ----
function svgT(el, x, y, sx, sy, rot = 0, px = 0, py = 0) {
  el.setAttribute("transform", `translate(${x} ${y}) translate(${px} ${py}) rotate(${rot}) scale(${sx} ${sy}) translate(${-px} ${-py})`);
}
function htmlT(el, o, x = 0, y = 0, sx = 1, sy = 1, rot = 0) { el.style.opacity = o; el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sx}, ${sy})`; }
function pop(el, t, s, d = 0.45, rise = 46) {
  const p = P(t, s, d), b = back(p), o = clamp(p * 4), squash = Math.sin(Math.PI * p) * (1 - p) * 0.22;
  htmlT(el, o, 0, (1 - out3(p)) * rise, b * (1 - squash * 0.5), b * (1 + squash));
}
const blinkOf = (t, off) => { const k = (t + off) % 3.0; return k > 2.85 ? 1 - Math.sin(Math.PI * (k - 2.85) / 0.15) * 0.92 : 1; };
const rot2 = (x, y, deg) => { const a = deg * Math.PI / 180; return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)]; };

// the other three slimes sink out of the way when he asks for quiet
const slime = (id, cx, cy, t, s, bob, ph) => {
  const el = $(id), p = P(t, s, 0.6), b = back(p);
  const idle = Math.sin(t * 2.6 + ph) * bob, breathe = 1 + Math.sin(t * 2.6 + ph + 1.1) * 0.012;
  const out = inOut(P(t, B.in, 0.5));
  const y = (1 - out3(p)) * 330 + idle + out * 420, k = Math.sin(Math.PI * p) * (1 - p) * 0.12;
  svgT(el, 0, y, b * (1 - k) * breathe, b * (1 + k) / breathe, 0, cx, cy + 140);
  el.setAttribute("opacity", clamp(p * 4) * (1 - out));
};

// ---- Abdelaziz: the close-up, the machine, the cup ----
const PIV = [660, 940];
function slimePose(t) {
  const p = P(t, A.slimes[3], 0.6), b = back(p), k = Math.sin(Math.PI * p) * (1 - p) * 0.12;
  const idle = Math.sin(t * 2.6 + 0.6) * 7, breathe = 1 + Math.sin(t * 2.6 + 1.7) * 0.012;
  const into = inOut(P(t, B.in, 0.7)), outB = inOut(P(t, B.out, 0.5));
  const go = inOut(P(t, B.go, 0.55)), comeBack = back(P(t, B.back, 0.7));
  const shift = -95 * go * (1 - comeBack);
  const lean = -5 * go * clamp(1 - comeBack, 0, 1);
  const mv = Math.sin(Math.PI * P(t, B.go, 0.55)) + Math.sin(Math.PI * P(t, B.back, 0.7)) * 0.7;
  const s = (1 + 0.7 * into) * b;
  return { tx: -10 * into + shift, ty: (1 - out3(p)) * 330 + idle + outB * 480, sx: s * (1 - k - mv * 0.05) * breathe, sy: s * (1 + k + mv * 0.05) / breathe, rot: lean };
}
function mapSlime(pose, p) { // a point of the slime's own drawing -> where it is on the screen now
  let q = [(p[0] - PIV[0]) * pose.sx, (p[1] - PIV[1]) * pose.sy];
  q = rot2(q[0], q[1], pose.rot);
  return [q[0] + PIV[0] + pose.tx, q[1] + PIV[1] + pose.ty];
}
const CUP_TRAY = [165, 868];

function coffeeScene(t) {
  const inB = t >= B.in - 0.05 && t < B.out + 0.7;
  const pose = slimePose(t);
  svgT($("s-purple"), pose.tx, pose.ty, pose.sx, pose.sy, pose.rot, PIV[0], PIV[1]);
  $("s-purple").setAttribute("opacity", clamp(P(t, A.slimes[3], 0.15)) * (1 - clamp(P(t, B.out + 0.2, 0.3))));
  // his mouth moves with his voice (from his own recording)
  const a = clamp(amp(t));
  $("mouth-talk").setAttribute("rx", 9 + 5 * a); $("mouth-talk").setAttribute("ry", 3 + 16 * a); $("mouth-talk").setAttribute("opacity", a > 0.05 ? 1 : 0);
  $("mouth-static").setAttribute("opacity", a > 0.05 ? 0 : 1);
  // glasses glint on "fixing"
  const g = P(t, B.line2 + 1.05, 0.3); $("glint").setAttribute("opacity", g > 0 && g < 1 ? Math.sin(Math.PI * g) : 0); svgT($("glint"), g * 22, -g * 8, 1, 1);

  const vis = inB ? 1 : 0;
  const L0 = mapSlime(pose, [500, 846]), R0 = mapSlime(pose, [830, 846]), M = mapSlime(pose, [679, 747]);
  const out = inOut(P(t, B.out, 0.5)) * 480;
  // machine slides in with a bounce, shakes when it works
  const mp = P(t, B.machine, 0.55), mb = back(mp);
  const lock = P(t, B.lock, 0.18), brewP = P(t, B.brew, 0.85);
  const shake = (Math.sin(Math.PI * lock) * 5 + (brewP > 0 && brewP < 1 ? 1.6 : 0)) * Math.sin(t * 60);
  const mx = (1 - mb) * -330 + shake;
  $("machine").setAttribute("opacity", clamp(mp * 4) * vis);
  svgT($("machine"), mx, out, 1, 1);
  $("lamp").setAttribute("fill", t >= B.lock ? "#FAD56F" : "#ccc"); $("lamp").setAttribute("stroke", t >= B.lock ? "#F4B93E" : "#111");
  const nd = -55 + 100 * brewP + Math.sin(t * 17) * 3 * (brewP > 0 && brewP < 1 ? 1 : 0); svgT($("needle"), 0, 0, 1, 1, nd, 116, 706);
  svgT($("pf"), 0, Math.sin(Math.PI * lock) * -4, 1, 1);

}

// cursor path in the app's own pixels (1920x1080)
const bez = (p0, p1, p2, p3, u) => { const v = 1 - u; return [0, 1].map((i) => v * v * v * p0[i] + 3 * v * v * u * p1[i] + 3 * v * u * u * p2[i] + u * u * u * p3[i]); };

}
const CAM_S = 0.5;

  $("spark").setAttribute("opacity", clamp(sp * 3) * Aout);
